name: Admission checks
on: [push, pull_request]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and start all services
        run: docker compose --profile concurrency up --build --wait --wait-timeout 180
      - name: Backend unit and real PostgreSQL integration tests
        run: docker compose --profile test run --build --rm tests
      - name: Frontend regression tests and lint
        run: |
          docker compose --profile test run --build --rm frontend-tests
          docker compose --profile test run --rm frontend-tests npm run lint -- --deny-warnings
      - name: Deployed PDF contract and cross-process concurrency
        run: |
          python scripts/smoke.py
          python scripts/verify-assessment.py --exercise --secondary-api http://localhost:8081
      - name: Restart containers and verify persistence
        run: |
          docker compose --profile concurrency down
          docker compose --profile concurrency up --wait --wait-timeout 180
          python scripts/verify-assessment.py --verify-persistence --secondary-api http://localhost:8081
          python scripts/smoke.py
      - name: Container logs
        if: failure()
        run: docker compose --profile concurrency logs
      - name: Stop services
        if: always()
        run: docker compose --profile concurrency --profile test down --volumes
