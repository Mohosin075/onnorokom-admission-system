# Optional bonus verification: a second independent API process sharing PostgreSQL.
services:
  backend-secondary:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApplicationMode: Assessment
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=db;Port=5432;Database=admission_portal;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      Database__MaxPoolSize: ${DATABASE_MAX_POOL_SIZE:-40}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.29.210.6
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
